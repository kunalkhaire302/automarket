services:
  - type: web
    name: automarket-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__SupabasePostgres
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        sync: false
      - key: Jwt__Audience
        sync: false
      - key: SupabaseStorage__Url
        value: https://fenvxhtfqxsypbujduvw.supabase.co
      - key: SupabaseStorage__Bucket
        value: Images
      - key: SupabaseStorage__ServiceRoleKey
        sync: false
      - key: Resend__ApiKey
        sync: false
      - key: Resend__From
        sync: false
